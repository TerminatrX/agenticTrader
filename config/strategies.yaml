# Strategy registry. `params` override the DEFAULTS dict on each strategy class.
# A strategy absent from this file is disabled regardless of registration.

strategies:
  trend_pullback:
    enabled: true
    universe:
      # Large, liquid names where a market order is unlikely to be punished —
      # which matters because fractional orders cannot be limit orders.
      - AAPL
      - MSFT
      - NVDA
      - GOOGL
      - AMZN
    params:
      # RSI band defining "pulled back but not capitulating". The floor exists
      # to avoid buying genuine breakdowns; below 30 the trend premise usually
      # is not intact regardless of what the moving averages still say.
      rsi_floor: 30.0
      rsi_ceiling: 45.0

      # Reject pullbacks deeper than this below the 20-day. Past roughly 12%
      # the move stops being a pullback and starts being a trend change.
      max_pullback_pct: 0.12

      # --- Stop construction -------------------------------------------
      # The stop decides the position size (notional = risk_budget / stop
      # distance), so these values move real money in a way the other
      # parameters here do not.

      # ATR(14) multiplier. The stop sits this many average daily ranges below
      # entry, so a volatile name gets a wider stop and a proportionally
      # smaller position. 2.0 puts AAPL near 5% at current volatility.
      atr_stop_multiple: 2.0

      # Bounds on the ATR-derived distance. The floor matters because sizing
      # divides by it: a 0.5% stop would imply 200x the risk budget in
      # notional. The ceiling is not a clamp — a setup whose volatility
      # demands more than this is declined outright, since a stop at the
      # ceiling would sit inside the stock's ordinary daily range.
      min_stop_pct: 0.02
      max_stop_pct: 0.12

      # Fallback only, used when ATR is unavailable. Recorded as
      # stop_basis: flat_pct, which the critic penalizes — a stop asserted
      # from a constant is a weaker claim than one measured from the stock.
      stop_pct: 0.05

      # Target as a multiple of initial risk.
      target_r_multiple: 2.0

      # Exit when momentum reaches this RSI.
      exit_rsi: 72.0

      # Entries below this confidence downgrade to WATCH instead of ENTER.
      min_confidence: 0.5

  momentum:
    # Stub — see src/agentic_trader/strategies/momentum.py. Keep disabled until
    # implemented; the stub returns NONE and would only add noise.
    enabled: false
    universe: []
    params: {}
