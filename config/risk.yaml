# Risk limits. Validated by agentic_trader.config.loader at startup —
# an unknown key or an out-of-bounds value raises rather than being ignored.
#
# Tuned for the Agentic account as it stands today: a ~$100 cash account.
# Re-tune when the account is funded; several values here only make sense at
# this size and are called out below.

# --- Sizing -------------------------------------------------------------
# risk_budget = total_value * risk_per_trade_pct
# notional    = risk_budget / stop_distance
# At $100 with a 5% stop: $1 risk -> $20 position.
risk_per_trade_pct: 0.01
max_position_pct: 0.25
min_order_notional: 1.00
# Absolute ceiling regardless of account size. Remove once the strategy has a
# real track record; until then it caps the damage from a sizing bug.
max_order_notional: 25.00

# --- Exposure -----------------------------------------------------------
# Two positions at $100. More would make each too small to clear the spread.
max_open_positions: 2
max_daily_loss_pct: 0.03
max_portfolio_exposure_pct: 0.80

# Combined exposure to any one sector. This BINDS IMMEDIATELY with the current
# universe — AAPL, MSFT, NVDA, GOOGL, AMZN are all one sector, so a single
# position at the 25% ceiling consumes the entire sector budget and the second
# is blocked. That is the control working; the fix is a more diversified
# universe, not a looser cap.
max_sector_exposure_pct: 0.25

# --- Reward -------------------------------------------------------------
# Minimum reward-to-risk from entry to target.
#
# Note this is inert for trend_pullback, which builds its target as
# entry + risk x target_r_multiple (2.0), so its ratio is always exactly 2.0.
# The gate matters for strategies whose targets come from structure. Raising
# this above 2.0 would block every trend_pullback entry rather than improving
# selectivity.
min_risk_reward: 2.0

# --- Kill switch (sticky) ----------------------------------------------
# Different in kind from max_daily_loss_pct, not just degree:
#   max_daily_loss_pct (3%)      blocks new entries, resets tomorrow
#   kill_switch_daily_loss_pct   writes HALT, stays until a human clears it
# Must exceed max_daily_loss_pct or the soft limit becomes dead code.
# Exits remain permitted when tripped — stranding open positions would be
# worse than the loss that triggered it.
kill_switch_daily_loss_pct: 0.06

# --- Stops --------------------------------------------------------------
default_stop_pct: 0.05
max_stop_pct: 0.12

# --- Timing gates -------------------------------------------------------
# AAPL's last report moved the stock 7.3% on a beat. Three days is the minimum
# defensible blackout; widen it if overnight gaps keep taking out stops.
earnings_blackout_days: 3
symbol_cooldown_days: 2

# --- Cash-account settlement -------------------------------------------
# All accounts on this login are cash accounts. Sale proceeds are unavailable
# until T+1, and spending them early causes a good-faith violation. Leave this
# on unless the account is upgraded to margin.
respect_unsettled_funds: true

# --- Liquidity and execution quality ------------------------------------
min_avg_volume_30d: 500000

# Two different risks, deliberately separated. They previously shared one key,
# which meant only one of them was ever actually measured.
#
# max_spread_pct      the real bid/ask spread at submission. Fractional orders
#                     must be market orders, so this cost is paid on every fill.
# max_price_drift_pct how far the live price has moved from the price the
#                     decision was made at. Wide drift means the setup changed
#                     and should be re-evaluated, not chased.
max_spread_pct: 0.005
max_price_drift_pct: 0.005

# --- Kill switch --------------------------------------------------------
# `touch HALT` at the project root stops all order construction immediately.
halt_file: HALT
